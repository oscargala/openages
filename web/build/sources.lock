# Python-2.3.3 release cannot stand in for the tree: of the tree's 442 files, 49 carry code
# changes against the release and 16 are not in the release at all.
cypython-2.3.3 version=2.3.3 url=https://foundry.openuru.org/gitblit/r/CWE-ou-minkata.git commit=7978641e0cd72b6332ba1fd8cf6bcc2298eecc65 path=Build/VS2010/SDKs/XPlatform/Cypython-2.3.3 tree=fec9818b5bc2089fcaf50cee74bcf0594cd0495e manifest-sha256=01e531aa8c203f9936fe467c05382e5e5a91c2332333725b3fa9215e93b3694f
# The commit, path and tree above belong together: the vendored proof holds the commit object and
# the trees on the path, and web/build/commit-proof.py follows them by their git ids.
# python2/build.sh checks it, then the tree, before every step, and refuses any other pin.
cypython-2.3.3-proof file=web/build/python2/cypython-ou-minkata-proof.txt sha256=a26f7dea857afb92ac1c6c3301001f561a4603f0c0299a85e30eaf96949a3950
