# Pinned inputs of the browser (wasm32-emscripten) build of plClient and plClient-py2.
#
# Every file the build scripts or the CI workflow download is listed here with
# its URL and SHA-256, and every git input with its commit. web/build/sources.sh reads this file:
# it downloads to a temporary name, checks the SHA-256 and only then renames the file into
# place, so a changed or truncated download stops the build instead of entering it.
#
# Format: one record per line, "<name> <key>=<value> ...", values without spaces.
#   url     where the file comes from          file    the name it is stored under
#   sha256  of the file's bytes                version the upstream version
#   commit  a git commit                       tree    the git tree id of path at commit
#   path    a directory inside the repository  manifest-sha256  see web/build/tree-hash.py
#
# What is pinned elsewhere, and why:
# - vcpkg ports. Every archive and patch a port downloads carries a SHA-512 in the port's own
#   files; vcpkg checks it before use. The ports come from the vcpkg submodule at the commit
#   below (also the root vcpkg.json's builtin-baseline) and from Scripts/Ports, so pinning the
#   commit pins them. PhysX's port keeps its patches in Scripts/Ports/physx, its pull request 569
#   commits included (upstream's port has kept them there since it stopped downloading them).
# - GitHub Actions: by full commit SHA in .github/workflows/web.yml.
# - The formatters of the port's own Python and JavaScript (ruff 0.17.1, prettier 3.9.10, eslint 10.13.0): in
#   web/build/formatters, in pip's and npm's own lock formats (requirements.txt with the SHA-256 of every file of the
#   release, package-lock.json with every package's integrity hash), which install.sh installs from. They check the
#   source tree and never enter a build.

# --- Toolchain --------------------------------------------------------------------------------
# Emscripten 6.0.12. The version of the emsdk record is the one pin of the Emscripten release
# build-deps.sh, build-client.sh and python2/build.sh (web/build/common.sh),
# movie-codecs.py and the CMake toolchain (cmake/emscripten/Toolchain.cmake) read it and refuse any
# other emcc version. On a workstation, install it with emsdk ("./emsdk install 6.0.12 &&
# ./emsdk activate 6.0.12"); the CI workflow checks out emsdk at this commit (one after the 6.0.12
# tag 35ff8a6d) and places the two downloads below into emsdk/downloads/ before
# "EMSDK_KEEP_DOWNLOADS=1 emsdk install", so emsdk uses them as they are.
#
# The client depends on this release beyond its public API. Before changing the pin, revalidate:
# - emscripten/plEmscriptenCwd.cpp, which builds on WasmFS internals (system/lib/wasmfs backend.h, paths.h,
#   virtual.h) and wraps getcwd and chdir (this release's getcwd answers "/" in a directory on a mount);
# - emscripten/plEmscriptenFetchBackend.js, which replaces src/lib/libwasmfs_fetch.js by defining the
#   same library symbols, and the OpenAL overrides emscripten/plEmscriptenOpenAL*.js (src/lib/libopenal.js);
# - the other functions plClient links with -Wl,--wrap (__syscall_poll, fopen, fclose, fseeko, fseek,
#   ungetc, ungetwc): plEmscriptenPoll.cpp and plEmscriptenStdio.cpp work around this release's WasmFS
#   and musl behaviour. plEmscriptenStdio.cpp's in-buffer seek mirrors musl's FILE (system/lib/libc/musl:
#   src/internal/stdio_impl.h:27-53) and relies on src/stdio/fseek.c, __stdio_read.c, __toread.c,
#   ungetc.c, ungetwc.c, setvbuf.c, ftell.c, ext2.c and __lockfile.c, and on WasmFS readAtOffset and
#   __wasi_fd_seek (system/lib/wasmfs/syscalls.cpp);
# - main.cpp's Finish, which calls musl's internal __funcs_on_exit, and main()'s explicit runtime
#   keepalive around this release's JSPI;
# - pnAsyncCore's resolver flags (pnAcDns.cpp: this release's getaddrinfo refuses AI_ADDRCONFIG) and
#   its WebSocket backend's placeholder addresses (pnAcSocketEmscripten.cpp);
# - plClient's non-LTO link (its CMakeLists.txt: this release's ThinLTO system libraries fail to link
#   with WasmFS);
# - the deps prefix and the movie codec package, which are rebuilt with the new release.
# (Paths under emscripten/ are in Sources/Plasma/Apps/plClient/.)
emsdk version=6.0.12 url=https://github.com/emscripten-core/emsdk.git commit=8f685c26ee9f672081e61e22c6aa60fa972d00a9 release=6e9f6885cb17a3d6c8fd488a5cff730f50aba61d
emsdk-6.0.12-linux-x86_64 version=6.0.12 url=https://storage.googleapis.com/webassembly/emscripten-releases-builds/linux/6e9f6885cb17a3d6c8fd488a5cff730f50aba61d/wasm-binaries.tar.xz file=6e9f6885cb17a3d6c8fd488a5cff730f50aba61d-wasm-binaries.tar.xz sha256=7b073a102b07eca5a0fe344037681e53162639f3540432456874c0446a5e8fa7
emsdk-node-24.19.0-linux-x86_64 version=24.19.0 url=https://storage.googleapis.com/webassembly/emscripten-releases-builds/deps/node-v24.19.0-linux-x64.tar.xz file=node-v24.19.0-linux-x64.tar.xz sha256=14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647
