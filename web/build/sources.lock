# three Visual Studio project files). The result must match the tree and manifest above.
cypython-2.3.3-cwe url=https://github.com/H-uru/Plasma.git commit=b970ae4bad024af47080456aba88c2548e5ea182 path=MOULOpenSourceClientPlugin/Plasma20/SDKs/XPlatform/Cypython-2.3.3 tree=9bb9ef4606d75d533ec105c6733df0566c91842a
