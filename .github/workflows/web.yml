name: Web
# The browser port's build and tests (web-build.yml): plClient and plClient-py2 for wasm32-emscripten from the pinned
# sources in web/build/sources.lock, the WGSL regeneration check, the web product's tests in Chromium, and the format
# of the port's own Python and JavaScript (ruff, prettier, eslint).
# The native unit tests run in ci.yml (the `check` target on each platform).
on: [push, pull_request, workflow_dispatch]

# No secrets, no game data: the build reads public sources only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/web-build.yml
